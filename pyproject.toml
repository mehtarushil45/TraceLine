[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceline"
version = "1.0.0"
description = "Payment network fraud ring detection and entity-resolution investigation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "xgboost>=2.0.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "gen-fraud-graph",
    "build",
    "dist",
    ".venv",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "gen-fraud-graph",
    ".venv",
]
